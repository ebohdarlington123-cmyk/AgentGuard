[package]
name = "agentguard-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AgentGuard on-chain policy firewall for AI agent payments on NEAR"
repository = "https://github.com/eboh-ebube/agentguard"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
